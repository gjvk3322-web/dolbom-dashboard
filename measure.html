<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>돌봄매트 실측 견적 (시공팀용)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow-x: hidden; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #f5f3ee;
  min-height: 100vh;
  color: #1a1a1a;
  padding: 12px;
  font-size: 14px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font-family: inherit; }
button { touch-action: manipulation; }

.header {
  max-width: 1180px; margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 0 4px;
}
.header-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
.header-badge {
  background: #1a1a1a; color: #fff; font-size: 10px;
  padding: 3px 8px; border-radius: 4px; letter-spacing: 1px; font-weight: 600;
}
.reset-btn {
  background: #fff; border: 1.5px solid #d8d8d8; border-radius: 8px;
  padding: 6px 12px; font-size: 12px; font-weight: 600; color: #666; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.reset-btn:active { transform: scale(0.97); }

/* 이전 입력을 되살렸을 때만 보이는 줄 (다른 현장 값이 섞이지 않게) */
.restore-bar {
  max-width: 1180px; margin: 0 auto 10px;
  display: flex; align-items: center; gap: 8px;
  background: #FFF8E1; border: 1px solid #FFD54F; border-radius: 10px;
  padding: 7px 8px 7px 12px; font-size: 12px; color: #6a4a00;
}
.restore-bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.restore-bar button {
  border: 1px solid #e0c060; background: #fff; border-radius: 6px; flex-shrink: 0;
  padding: 6px 10px; font-size: 12px; font-weight: 700; color: #8B6914; cursor: pointer;
}
.restore-bar button.x { border: none; background: transparent; font-size: 15px; padding: 2px 6px; color: #b39a55; }

/* 폰: 현장 체크 → 실측 치수 → 견적 → 실측 결과 순서로 한 줄
   넓은 화면: 왼쪽 현장 체크 / 오른쪽 실측 치수·견적·실측 결과 */
.layout { max-width: 1180px; margin: 0 auto; }
@media (min-width: 900px) {
  .layout { display: grid; grid-template-columns: 400px 1fr; gap: 14px; align-items: start; }
  .col { min-width: 0; }
}

.card {
  background: #fff; border-radius: 14px; padding: 14px;
  margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.card-title {
  font-size: 13px; font-weight: 700; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px; color: #1a1a1a;
}
.card-title .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; background: #1a1a1a; color: #fff;
  font-size: 10px; border-radius: 50%; font-weight: 700;
}
.card-title .sub { font-size: 10px; color: #999; font-weight: 400; margin-left: auto; }

/* ===== ② 실측 치수 ===== */
.site-input {
  width: 100%; padding: 9px 11px; margin-bottom: 10px;
  border: 1.5px solid #e0ddd6; border-radius: 8px; background: #fff;
  font-size: 16px; color: #1a1a1a;
}
.site-input:focus { outline: none; border-color: #2E7D32; }

.dim-room { margin-bottom: 8px; padding: 8px; background: #fafaf7; border-radius: 8px; }
.dim-room.minus { background: #fdf3f2; }
.dim-room-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.dim-name {
  flex: 1; min-width: 0; padding: 1px 2px;
  border: none; border-bottom: 1px dashed #d0cdc6; border-radius: 0; background: transparent;
  font-size: 16px; font-weight: 600; color: #333;
}
.dim-name:focus { outline: none; border-bottom-color: #2E7D32; }
.dim-minus-tag {
  font-size: 10px; font-weight: 700; color: #d32f2f; flex-shrink: 0;
  border: 1px solid #f0c0c0; background: #fff; border-radius: 4px; padding: 1px 5px;
}
.dim-area { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #888; flex-shrink: 0; }
.dim-area.warn { color: #d32f2f; font-weight: 700; }
.dim-room-remove {
  font-size: 10px; color: #d32f2f; cursor: pointer; flex-shrink: 0;
  padding: 3px 7px; border: 1px solid #f0c0c0; border-radius: 4px; background: #fff;
}
.dim-inputs { display: flex; gap: 4px; align-items: center; }
.dim-input {
  flex: 1; min-width: 0; padding: 8px 4px;
  border: 1.5px solid #e0ddd6; border-radius: 6px; background: #fff;
  font-size: 16px; font-family: 'JetBrains Mono', monospace; text-align: center;
}
.dim-input:focus { outline: none; border-color: #2E7D32; }
.dim-x { color: #ccc; font-size: 11px; }
.dim-unit { color: #bbb; font-size: 10px; }

.dim-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 10px; }
.dim-chip {
  padding: 7px 10px; border: 1.5px dashed #d0cdc6; border-radius: 8px;
  background: #fff; font-size: 12px; font-weight: 600; color: #666; cursor: pointer;
}
.dim-chip:active { transform: scale(.96); }

.dim-total { background: #E8F5E9; border-radius: 10px; padding: 10px 12px; }
.dim-total-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-size: 12px; font-weight: 600; color: #2E7D32;
}
.dim-total-head b { font-family: 'JetBrains Mono', monospace; font-size: 15px; margin-left: 4px; }
.dim-total-head span { font-size: 10px; font-weight: 400; color: #6a9a6d; }
.dim-total-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.dim-total-lbl { font-size: 12.5px; font-weight: 700; color: #1a1a1a; width: 62px; flex-shrink: 0; }
.dim-total-calc {
  flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace;
  font-size: 18px; font-weight: 700; color: #1B5E20; white-space: nowrap;
}
.dim-total-calc s { font-size: 13px; color: #9aa59b; font-weight: 500; }
.dim-total-calc small {
  font-family: 'Noto Sans KR', sans-serif; font-size: 10px; font-weight: 700;
  color: #FF8F00; margin-left: 5px;
}
.dim-ovr {
  width: 96px; flex-shrink: 0; padding: 7px 4px;
  border: 1.5px solid #A5D6A7; border-radius: 6px; background: #fff;
  font-size: 16px; font-family: 'JetBrains Mono', monospace; text-align: center;
}
.dim-ovr::placeholder { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; color: #aaa; }
.dim-ovr:focus { outline: none; border-color: #2E7D32; }

/* ===== ③ 견적 ===== */
.seg { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #e0ddd6; }
.seg-btn {
  flex: 1; padding: 9px 2px; border: none; background: #fff;
  font-size: 12px; color: #666; cursor: pointer; white-space: nowrap;
}
.seg-btn + .seg-btn { border-left: 1px solid #e0ddd6; }
.seg-btn.active { background: #2E7D32; color: #fff; font-weight: 700; }

.ben-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.ben-chip {
  padding: 7px 10px; border: 1.5px solid #e0ddd6; border-radius: 8px; background: #fff;
  cursor: pointer; user-select: none; -webkit-user-select: none; color: #aaa; line-height: 1.35;
}
.ben-name { font-size: 12px; font-weight: 600; display: block; }
.ben-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; display: block; }
.ben-chip.checked { background: #E8F5E9; border-color: #A5D6A7; color: #1a1a1a; }
.ben-chip.checked .ben-label { color: #d32f2f; }
.ben-chip.phase2.checked { background: #FFF8E1; border-color: #FFD54F; }
.ben-chip.phase2.checked .ben-label { color: #FF8F00; }

.quote-context {
  background: #fff; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px;
  border-left: 3px solid #2E7D32; box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.quote-context-line {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px;
  font-size: 13px; line-height: 1.5;
}
.quote-context-line .qc-label { color: #888; font-weight: 500; }
.quote-context-line .qc-val { font-weight: 700; color: #1a1a1a; }
.quote-context-line .qc-val .small { font-size: 11.5px; color: #666; font-weight: 500; margin-left: 2px; }
.quote-context-line .qc-divider { color: #ccc; font-weight: 300; }

.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 10px; }
.result-grid.single { grid-template-columns: 1fr; }

/* 폰에서 여러 제품을 같이 볼 때: 큰 카드 대신 한 줄 비교 (줄을 누르면 그 제품 상세) */
.cmp-list { display: none; margin: 12px 0 10px; }
.cmp-row {
  background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
  border: 2px solid transparent; cursor: pointer;
}
.cmp-row.highlight { border-color: #2E7D32; }
.cmp-row.highlight-orange { border-color: #FF8F00; }
.cmp-row.highlight-amber { border-color: #C79100; }
.cmp-top { display: flex; align-items: center; gap: 6px; }
.cmp-name { font-size: 14px; font-weight: 800; letter-spacing: -0.3px; }
.cmp-badge {
  font-size: 9.5px; font-weight: 700; color: #fff; background: #2E7D32;
  border-radius: 5px; padding: 2px 6px; white-space: nowrap;
}
.cmp-badge.orange { background: #FF8F00; }
.cmp-badge.amber { background: #C79100; }
.cmp-qty {
  margin-left: auto; font-family: 'JetBrains Mono', monospace;
  font-size: 20px; font-weight: 700; line-height: 1; white-space: nowrap;
}
.cmp-qty small { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; color: #999; font-weight: 500; margin-left: 2px; }
.cmp-bottom { display: flex; align-items: baseline; justify-content: flex-end; flex-wrap: wrap; gap: 2px 6px; margin-top: 6px; }
.cmp-before { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #aaa; text-decoration: line-through; margin-right: auto; }
.cmp-label { font-size: 10px; color: #999; }
.cmp-final { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 800; color: #2E7D32; letter-spacing: -0.5px; }
.cmp-final.phase2 { color: #FF8F00; }
.cmp-note { font-size: 10px; color: #d32f2f; text-align: right; margin-top: 2px; font-weight: 500; }
@media (max-width: 700px) {
  .cmp-list.on { display: block; }
  .result-grid.multi { display: none; }
  .chart-card { display: none !important; }
}

.product-card {
  background: #fff; border-radius: 14px; padding: 16px 12px 12px;
  position: relative; border: 2px solid transparent;
}
.product-card.highlight { border-color: #2E7D32; box-shadow: 0 4px 16px rgba(46,125,50,.12); }
.product-card.highlight-orange { border-color: #FF8F00; }
.product-card.highlight-amber { border-color: #C79100; }
.product-badge {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  background: #2E7D32; color: #fff;
  font-size: 10px; padding: 3px 10px; border-radius: 6px;
  font-weight: 700; white-space: nowrap; letter-spacing: 0.5px;
}
.product-badge.orange { background: #FF8F00; }
.product-badge.amber { background: #C79100; }
.product-name { font-size: 15px; font-weight: 800; text-align: center; letter-spacing: -0.3px; }
.product-feature { font-size: 10px; color: #888; text-align: center; margin-top: 3px; margin-bottom: 12px; }
.product-divider { height: 1px; background: #f0ede5; margin: 8px 0; }
.product-qty {
  text-align: center; font-family: 'JetBrains Mono', monospace;
  font-size: 28px; font-weight: 700; color: #1a1a1a; letter-spacing: -1px; line-height: 1;
}
.product-qty-label { text-align: center; font-size: 10px; color: #FF8F00; font-weight: 700; margin-top: 4px; }
.product-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: #666; margin-top: 4px;
}
.product-row .val { font-weight: 600; color: #1a1a1a; font-family: 'JetBrains Mono', monospace; }
.product-total { background: #f9f7f2; border-radius: 8px; padding: 10px; margin-top: 10px; text-align: right; }
.product-total-label { font-size: 10px; color: #999; font-weight: 500; }
.product-total-val {
  font-size: 17px; font-weight: 800; color: #2E7D32;
  font-family: 'JetBrains Mono', monospace; letter-spacing: -0.5px; margin-top: 2px; white-space: nowrap;
}
.product-total-original {
  font-size: 10px; color: #aaa; text-decoration: line-through;
  margin-top: 1px; font-family: 'JetBrains Mono', monospace;
}
.product-install-note { font-size: 10px; color: #d32f2f; text-align: center; margin-top: 4px; font-weight: 500; }
.product-phase2-box {
  margin-top: 8px; padding: 8px 10px;
  background: #FFF8E1; border-radius: 8px; border: 1px dashed #FFB74D;
}
.product-phase2-title { font-size: 9.5px; color: #FF8F00; font-weight: 700; margin-bottom: 4px; }
.product-phase2-final { text-align: right; margin-top: 6px; padding-top: 6px; border-top: 1px solid #FFE0A0; }
.product-phase2-final-label { font-size: 9px; color: #FF8F00; font-weight: 600; }
.product-phase2-final-val {
  font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 800;
  color: #FF8F00; margin-top: 2px; letter-spacing: -0.5px; white-space: nowrap;
}

.payment-notice {
  background: #E8F5E9; border: 1px solid #A5D6A7; border-left: 4px solid #2E7D32;
  border-radius: 10px; padding: 10px 14px 10px 16px; margin-bottom: 10px;
  font-size: 12px; color: #2E7D32; line-height: 1.5;
}
.payment-notice b { color: #1B5E20; font-weight: 700; }

.chart-card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.chart-row:last-child { margin-bottom: 0; }
.chart-label {
  width: 130px; font-size: 12px; font-weight: 600; flex-shrink: 0;
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
}
.chart-bar-wrap {
  flex: 1; min-height: 28px; background: #f5f3ee; border-radius: 6px;
  position: relative; display: flex; flex-direction: column; gap: 3px; padding: 3px;
}
.chart-bar-track {
  height: 22px; background: rgba(0,0,0,.04);
  border-radius: 4px; position: relative; overflow: hidden;
}
.chart-bar {
  height: 100%; background: linear-gradient(90deg, #2E7D32, #4CAF50);
  border-radius: 4px; transition: width .4s cubic-bezier(.4,0,.2,1);
  display: flex; align-items: center; padding: 0 8px; justify-content: flex-end;
}
.chart-bar.bar-orange { background: linear-gradient(90deg, #FF8F00, #FFB74D); }
.chart-bar.bar-amber { background: linear-gradient(90deg, #C79100, #FFD54F); }
.chart-bar.bar-original { background: linear-gradient(90deg, #b0aca5, #d0cdc6); }
.chart-bar-val { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap; }
.chart-bar-val.original { color: #fff; opacity: 0.95; }
.chart-bar-tag {
  position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  font-size: 9px; font-weight: 700; color: rgba(255,255,255,.95);
  letter-spacing: 0.3px; pointer-events: none;
}
.chart-cheapest {
  display: inline-block; background: #FFD54F; color: #5a4500;
  font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
}
.chart-saved-badge {
  display: inline-block; background: #E8F5E9; color: #2E7D32;
  font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
  margin-top: 2px; font-family: 'JetBrains Mono', monospace;
}

.empty-state {
  background: #fff; border-radius: 14px;
  padding: 34px 20px; text-align: center; color: #999;
}
.empty-state-icon { font-size: 30px; margin-bottom: 8px; }
.empty-state-text { font-size: 13px; line-height: 1.6; }

/* ===== ① 현장 체크 ===== */
.chk-progress {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  color: #2E7D32; background: #E8F5E9; border-radius: 10px; padding: 2px 8px;
}
.chk-flagcount {
  font-size: 11px; font-weight: 700; color: #b26a00;
  background: #FFF3D6; border-radius: 10px; padding: 2px 8px;
}
.chk-say-toggle {
  margin-left: auto; border: 1px solid #e0ddd6; background: #fff; border-radius: 8px;
  padding: 5px 10px; font-size: 11px; font-weight: 600; color: #666; cursor: pointer;
}
.chk-say-toggle.on { background: #FFF8E1; border-color: #FFD54F; color: #8B6914; }
.chk-group {
  font-size: 11px; font-weight: 700; color: #2E7D32;
  margin-top: 12px; padding-bottom: 4px; border-bottom: 2px solid #E8F5E9;
}
.chk-group:first-child { margin-top: 0; }
.chk-item { padding: 9px 0; border-bottom: 1px solid #f0ede5; }
.chk-row { display: flex; align-items: center; gap: 8px; }
.chk-main { flex: 1; min-width: 0; cursor: pointer; }
.chk-title { font-size: 13.5px; font-weight: 700; color: #1a1a1a; }
.chk-hint { font-size: 11px; color: #888; line-height: 1.45; margin-top: 1px; }
.chk-btns { display: flex; gap: 4px; flex-shrink: 0; }
.chk-btn {
  min-width: 46px; padding: 9px 0; border: 1.5px solid #e0ddd6; border-radius: 8px;
  background: #fff; font-size: 12px; font-weight: 700; color: #999; cursor: pointer;
}
.chk-item.ok .chk-btn.b-ok { background: #2E7D32; border-color: #2E7D32; color: #fff; }
.chk-item.flag .chk-btn.b-flag { background: #FF8F00; border-color: #FF8F00; color: #fff; }
.chk-item.ok .chk-title { color: #2E7D32; }
.chk-say {
  display: none; margin-top: 7px; padding: 8px 10px;
  background: #FFF8E1; border-left: 3px solid #FFB74D; border-radius: 6px;
  font-size: 12px; color: #5a4500; line-height: 1.5;
}
.chk-item.open .chk-say, .chk-list.say-all .chk-say { display: block; }
.chk-memo {
  display: none; width: 100%; margin-top: 7px; padding: 8px 10px;
  border: 1.5px solid #FFB74D; border-radius: 8px; background: #fff; font-size: 16px;
}
.chk-memo:focus { outline: none; border-color: #FF8F00; }
.chk-item.flag .chk-memo { display: block; }
.chk-note {
  width: 100%; margin-top: 12px; padding: 9px 11px; min-height: 60px; resize: vertical;
  border: 1.5px solid #e0ddd6; border-radius: 8px; background: #fff;
  font-size: 16px; line-height: 1.5; display: block;
}
.chk-note:focus { outline: none; border-color: #2E7D32; }

/* ===== ④ 실측 결과 ===== */
.reply-card {
  background: #FEF7D0; border: 1.5px solid #FFE066; border-radius: 14px;
  padding: 12px; margin-bottom: 10px;
}
.reply-title { font-size: 13px; font-weight: 700; color: #8B6914; margin-bottom: 8px; }
.reply-text {
  background: #fff; border-radius: 8px; padding: 10px 12px;
  font-size: 12px; line-height: 1.6; color: #333; white-space: pre-wrap; word-break: break-word;
  border: 1px solid #f0e4c0; margin-bottom: 8px; max-height: 420px; overflow-y: auto;
}
.reply-text[data-empty="true"] {
  color: #a08040; font-style: italic; text-align: center; padding: 16px 12px;
}
.reply-btn {
  width: 100%; border: none; border-radius: 8px; padding: 12px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  background: #2E7D32; color: #fff;
}
.reply-btn:active { transform: scale(.98); }

.page-footer { max-width: 1180px; margin: 6px auto 0; text-align: center; font-size: 10px; color: #bbb; }

.toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.9);
  background: rgba(30,30,30,.95); color: #fff;
  padding: 16px 28px; border-radius: 12px;
  font-size: 14px; font-weight: 600; z-index: 999;
  transition: all .25s; opacity: 0; pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,.25); white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

@media (max-width: 460px) {
  body { padding: 10px; }
  .header-title { font-size: 14px; }
  .product-qty { font-size: 26px; }
  .chart-label { width: 104px; font-size: 11px; }
  .payment-notice { font-size: 11px; padding: 9px 12px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    📐 돌봄매트 실측 견적

      </div>

        </div>

    <!-- ===== ③ 견적 ===== -->
    <div id="secQuote">

        <div class="card-title"><span class="num">3</span> 견적</div>

          <button type="button" class="seg-btn active" data-prod="all" onclick="setProd('all')">전체</button>
          <button type="button" class="seg-btn" data-prod="mat1000_22" onclick="setProd('mat1000_22')">1000 22T</button>
          <button type="button" class="seg-btn" data-prod="mat1000_17" onclick="setProd('mat1000_17')">1000 17T</button>
          <button type="button" class="seg-btn" data-prod="mat500" onclick="setProd('mat500')">500 22T</button>
        </div>
        <div class="ben-grid" id="benefitList"></div>
      </div>

      <div id="quoteContext" class="quote-context" style="display:none">
        <div id="quoteContextBody"></div>
      </div>

      <div id="resultGrid" class="result-grid"></div>

      <div id="paymentNotice" class="payment-notice" style="display:none">
        💡 <b>실제 시공된 매트 수량만큼만 결제됩니다</b> · 실측 수량은 참고용이며 시공 시 ±변동 가능
      </div>

      <div id="chartCard" class="chart-card" style="display:none">

        <div id="chartContent"></div>
      </div>
    </div>

    <!-- ===== ④ 실측 결과 ===== -->
    <div class="reply-card" id="secReply">
      <div class="reply-title">💬 실측 결과 (카톡 전달용)</div>
      <div class="reply-text" id="replyText" data-empty="true">치수를 입력하면 실측 결과가 자동으로 만들어집니다.</div>
      <button type="button" class="reply-btn" onclick="copyReply()">📋 복사하기</button>
    </div>
  </div>

</div>

<div class="page-footer" id="pageFooter"></div>
<div class="toast" id="toast"></div>

<script>
var MEASURE_VER = '2026.11.24.2';

// ===== 제품 데이터 =====
// 가격·시공비 기준은 cs-quote.html과 같은 값 — 바뀌면 여기도 같이 수정
// 배지는 고객이 화면을 같이 보므로 고객용 견적(quote.html) 표기를 따름
var PRODUCTS = [
  { key:'mat1000_22', name:'1000매트 22T', label:'1000매트 22T(1M X 1M 두께 2.2cm)', thickness:'22T', price:79500,

  { key:'mat1000_17', name:'1000매트 17T', label:'1000매트 17T(1M X 1M 두께 1.7cm)', thickness:'17T', price:67000,
    feature:'논슬립·방오·황변억제', badge:'대형·실속',   badgeClass:'orange', cardClass:'highlight-orange',  is1000:true,  icon:'' },
  { key:'mat500',     name:'500매트 22T',  label:'500매트 22T(50cm X 50cm 두께 2.2cm)', thickness:'22T', price:17500,
    feature:'기본 코팅',          badge:'실속형',       badgeClass:'amber',  cardClass:'highlight-amber',   is1000:false, icon:'💰' }
];

var INSTALL_FEE = 100000;
var INSTALL_THRESHOLD_500 = 99;
var INSTALL_THRESHOLD_1000 = 24;

// ===== 혜택 데이터 (cs-quote.html과 동일) =====
var BENEFITS = [
  { key:'review_contract', name:'계약 후기 작성',     desc:'샘플박스 3만원 쿠폰 지급',  type:'fixed',   discount:30000, label:'-30,000원', phase:1 },
  { key:'group_buy',       name:'5인 공동구매',       desc:'5인 이상 공동구매 시',       type:'percent', discount:3,     label:'-3%',       phase:1 },
  { key:'onnuri',          name:'온누리 결제',    desc:'디지털온누리 앱 7% 할인',    type:'percent', discount:7,     label:'-7%',       phase:1 },
  { key:'review_event',    name:'후기 이벤트',         desc:'원하는 만큼 작성 시 캐시백',  type:'fixed',   discount:100000, label:'-100,000원', phase:2 }
];

// ===== 현장 체크 항목 =====
// t: 항목 / c: 현장에서 확인할 것 / s: 고객 안내 멘트
// 항목을 바꾸려면 이 목록만 고치면 됨 (key는 저장용이라 서로 겹치지 않게)
var CHECK_GROUPS = [
  { title:'문·가전 걸림', items:[
    { key:'pantry',    t:'팬트리·붙박이장 문',
      c:'안쪽까지 열어 확인 · 샘플 매트 대고 문 끝까지 열기',
      s:'문이 걸리면 경첩을 조정해 맞추고, 공간이 부족하면 1cm 매트로 시공하거나 그 부분만 비워 둡니다.' },
    { key:'door',      t:'방문·중문',
      c:'문이 움직이는 전 구간 · 중문 슬라이드 레일',
      s:'방문 앞은 경사매트를 재단해 마감해서 약간의 단차가 생길 수 있습니다.' },
    { key:'appliance', t:'냉장고·식기세척기·하단 서랍',
      c:'냉장고·김치냉장고 아래 문/서랍, 식기세척기 문, 주방 하단 수납·거실장 서랍 열어보기',
      s:'걸리는 곳은 매트를 어디서 끝낼지 오늘 같이 정해 두겠습니다.' }
  ]},
  { title:'범위·수량', items:[
    { key:'scope',     t:'시공 범위',
      c:'깔 곳·뺄 곳 같이 짚기 — 팬트리 안, 소파·침대 밑, 주방 끝, 현관 앞, 점검구·통풍구',
      s:'오늘 정한 범위 기준으로 견적을 드리고, 범위가 바뀌면 수량과 금액도 달라집니다.' },
    { key:'furniture', t:'가구 이동·배치',
      c:'옮길 큰 가구(소파·침대·피아노·안마의자) · 새 가구나 배치 변경 계획',
      s:'가구에 맞춰 재단한 곳은 나중에 가구를 옮기면 안 맞을 수 있습니다.' },
    { key:'edge',      t:'끝단 마감',
      c:'현관·욕실·방 입구에서 끝나는 위치 · 기둥·좁은 복도의 작은 조각 · 휜 벽',
      s:'끝나는 곳은 경사로 마감하고, 벽이 휜 곳은 약간의 틈이 생길 수 있습니다.' },
    { key:'qty',       t:'수량·금액',
      c:'상담 견적과 실측 장수 차이 · 소량 시공비 해당 여부',
      s:'실측 수량은 참고용이고, 최종 금액은 시공 당일 실제 시공된 매트 수량만큼만 정산됩니다.' }
  ]},
  { title:'바닥·사용', items:[
    { key:'floor',     t:'바닥 상태',
      c:'마루 들뜸·장판 울음·타일 단차 · 창가·외벽·싱크대 앞 습기·곰팡이 흔적 (사진)',
      s:'바닥에 문제가 보이는 곳은 사진으로 남겨 본사 확인 후 안내드리겠습니다.' },
    { key:'press',     t:'눌림 안내',
      c:'식탁 의자·무거운 가구가 놓일 자리',
      s:'쿠션감이 있는 제품이라 가구·의자에 의한 눌림은 있을 수 있고, 눌린 자국은 다리미로 복원이 가능할 수 있습니다.' },
    { key:'life',      t:'로봇청소기·커튼',
      c:'로봇청소기 기종·충전대 자리 · 커튼 밑단과 바닥 사이 여유',
      s:'바닥이 매트 두께만큼 높아져 커튼이 끌릴 수 있고, 로봇청소기는 기종에 따라 오르내림이 다를 수 있습니다.' }
  ]}
];

// ===== 상태 =====
var DEFAULT_ROOM_NAMES = ['거실', '복도', '주방'];
var rooms = [];            // { id, name, minus, w, h } — minus(제외 구역)는 추가 버튼을 뺐고(2026-11-24), 저장돼 있던 줄만 그대로 계산
var roomIdCounter = 0;
var selProd = 'all';       // 'all' 또는 제품 key
var selectedBenefits = { review_contract: true, group_buy: true, onnuri: true, review_event: true };
var checkState = {};       // key → { s: 0 미확인 | 1 확인 | 2 특이, memo }
var lastResults = [];

var DRAFT_KEY = 'dolbom_measure_draft_v1';
var SAY_KEY = 'dolbom_measure_say_all';
var DRAFT_MAX_AGE = 12 * 60 * 60 * 1000;   // 12시간 지난 임시 저장은 버림 (다른 현장 값이 남지 않게)

function byId(id) { return document.getElementById(id); }
function fmt(n) { return (n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function onlyNum(v) { return String(v == null ? '' : v).replace(/[^0-9]/g, ''); }
function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function showToast(msg) {
  var t = byId('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

// ===== 실측 치수 =====
function initRooms() {
  rooms = [];
  DEFAULT_ROOM_NAMES.forEach(function(n){
    rooms.push({ id: roomIdCounter++, name: n, minus: false, w: '', h: '' });
  });
  renderRooms();
}
// 방 1, 방 2 … 처럼 안 쓰는 번호를 붙임 (이름은 줄에서 바로 고칠 수 있음)
function nextRoomName(base) {
  var names = rooms.map(function(r){ return r.name; });
  var i = 1;
  while (names.indexOf(base + ' ' + i) >= 0) i++;
  return base + ' ' + i;
}
function addRoom(base) {
  var r = { id: roomIdCounter++, name: nextRoomName(base), minus: false, w: '', h: '' };
  rooms.push(r);
  renderRooms();
  recalculate();
  var first = document.querySelector('#dimRoom' + r.id + ' .dim-input');
  if (first) first.focus();
}
function removeRoom(id) {
  rooms = rooms.filter(function(r){ return r.id !== id; });
  renderRooms();
  recalculate();
}
function renderRooms() {
  var c = byId('dimRooms');
  c.innerHTML = '';
  rooms.forEach(function(r){
    var d = document.createElement('div');
    d.className = 'dim-room' + (r.minus ? ' minus' : '');
    d.id = 'dimRoom' + r.id;
    d.innerHTML =
      '<div class="dim-room-head">' +
        (r.minus ? '<span class="dim-minus-tag">제외</span>' : '') +
        '<input class="dim-name" type="text" autocomplete="off" aria-label="구역 이름" placeholder="' + (r.minus ? '예: 아일랜드 식탁' : '구역 이름') + '" value="' + escapeHtml(r.name) + '" oninput="updateRoomName(' + r.id + ',this.value)">' +
        '<span class="dim-area" id="dimArea' + r.id + '"></span>' +
        '<span class="dim-room-remove" onclick="removeRoom(' + r.id + ')">삭제</span>' +
      '</div>' +
      '<div class="dim-inputs">' +
        '<input class="dim-input" type="text" inputmode="numeric" autocomplete="off" placeholder="가로" value="' + onlyNum(r.w) + '" oninput="this.value=this.value.replace(/[^0-9]/g,\'\'); updateRoomDim(' + r.id + ',\'w\',this.value)">' +
        '<span class="dim-x">×</span>' +
        '<input class="dim-input" type="text" inputmode="numeric" autocomplete="off" placeholder="세로" value="' + onlyNum(r.h) + '" oninput="this.value=this.value.replace(/[^0-9]/g,\'\'); updateRoomDim(' + r.id + ',\'h\',this.value)">' +
        '<span class="dim-unit">mm</span>' +
      '</div>';
    c.appendChild(d);
  });
}
function updateRoomDim(id, axis, val) {
  var r = rooms.find(function(x){ return x.id === id; });
  if (r) r[axis] = val;
  recalculate();
}
function updateRoomName(id, val) {
  var r = rooms.find(function(x){ return x.id === id; });
  if (r) r.name = val;
  recalculate();
}
function roomArea(r) {
  var w = parseInt(r.w, 10) || 0;
  var h = parseInt(r.h, 10) || 0;
  return (w > 0 && h > 0) ? w * h : 0;   // mm²
}
function totalAreaMm2() {
  var t = 0;
  rooms.forEach(function(r){ t += (r.minus ? -1 : 1) * roomArea(r); });
  return Math.max(0, t);
}
// 면적 → 장수. 재단 여유 +10%를 더한 뒤 한 번만 올림 (cs-quote.html 도면 계산과 같은 기준)
// 정수로만 계산해서 소수점 오차로 1장이 더 붙는 일이 없음
function calcQtyFromDim(is1000) {
  var matArea = is1000 ? 1000000 : 250000;   // mm²
  var area = totalAreaMm2();
  if (area <= 0) return 0;
  return Math.ceil((area * 11) / (matArea * 10));
}
// 장수 조정 칸에 직접 넣은 값 (없으면 0)
function ovrQty(is1000) {
  return parseInt(byId(is1000 ? 'ovr1000' : 'ovr500').value, 10) || 0;
}
function renderQtyLine(elId, calc, o) {
  var el = byId(elId);
  if (o > 0) {
    el.innerHTML = (calc > 0 && calc !== o ? '<s>' + calc + '</s> ' : '') + o + '장<small>조정</small>';
  } else {
    el.textContent = calc > 0 ? calc + '장' : '–';
  }
}

// ===== 제품 선택 · 혜택 =====
function setProd(key) {
  selProd = key;
  updateProdSeg();
  recalculate();
}
function updateProdSeg() {
  document.querySelectorAll('#prodSeg .seg-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-prod') === selProd);
  });
}
function renderBenefits() {
  var c = byId('benefitList');
  c.innerHTML = '';
  BENEFITS.forEach(function(b){
    var checked = !!selectedBenefits[b.key];
    var item = document.createElement('div');
    item.className = 'ben-chip' + (checked ? ' checked' : '') + (b.phase === 2 ? ' phase2' : '');
    item.onclick = function(){ toggleBenefit(b.key); };
    item.innerHTML = '<span class="ben-name">' + b.name + '</span><span class="ben-label">' + b.label + '</span>';
    c.appendChild(item);
  });
}
function toggleBenefit(key) {
  selectedBenefits[key] = !selectedBenefits[key];
  if (!selectedBenefits[key]) delete selectedBenefits[key];
  renderBenefits();
  recalculate();
}

// ===== 계산 =====
function computeResults() {
  return PRODUCTS.map(function(p){
    var calcQty = calcQtyFromDim(p.is1000);
    var o = ovrQty(p.is1000);
    var totalQty = o > 0 ? o : calcQty;
    var matCost = totalQty * p.price;

    var threshold = p.is1000 ? INSTALL_THRESHOLD_1000 : INSTALL_THRESHOLD_500;
    var hasInstallFee = totalQty > 0 && totalQty <= threshold;
    var installFee = hasInstallFee ? INSTALL_FEE : 0;

    var p1Discount = 0, p1Details = [];
    var p2Discount = 0, p2Details = [];
    BENEFITS.forEach(function(b){
      if (!selectedBenefits[b.key]) return;
      var d = (b.type === 'fixed') ? b.discount : Math.round(matCost * b.discount / 100);
      if (b.phase === 1) {
        p1Discount += d;
        p1Details.push({ name:b.name, label:b.label, amount:d });
      } else {
        p2Discount += d;
        p2Details.push({ name:b.name, label:b.label, amount:d });
      }
    });

    var beforeDiscount = matCost + installFee;
    var totalCost = Math.max(0, beforeDiscount - p1Discount);
    var finalCost = Math.max(0, totalCost - p2Discount);

    return {
      product: p, calcQty: calcQty, overridden: o > 0, totalQty: totalQty,
      matCost: matCost, hasInstallFee: hasInstallFee, installFee: installFee,
      p1Discount: p1Discount, p1Details: p1Details,
      p2Discount: p2Discount, p2Details: p2Details,
      hasPhase2: p2Details.length > 0,
      beforeDiscount: beforeDiscount, totalCost: totalCost, finalCost: finalCost,
      threshold: threshold
    };
  }).filter(function(r){ return r.totalQty > 0; });
}
// 화면·결과 문구에 보여줄 제품 (제품을 골랐으면 그것만)
function visibleResults(results) {
  if (selProd === 'all') return results;
  var one = results.filter(function(r){ return r.product.key === selProd; });
  return one.length > 0 ? one : results;
}

function recalculate() {
  // 구역별 면적
  rooms.forEach(function(r){
    var el = byId('dimArea' + r.id);
    if (!el) return;
    var a = roomArea(r);
    // 가로·세로가 둘 다 1m 미만이면 cm로 넣었을 수 있어 한 번 확인하게 표시 (제외 구역은 작을 수 있어 뺌)
    var warn = a > 0 && !r.minus && (parseInt(r.w, 10) || 0) < 1000 && (parseInt(r.h, 10) || 0) < 1000;
    el.textContent = a > 0 ? ((r.minus ? '−' : '') + (a / 1e6).toFixed(2) + '㎡' + (warn ? ' · mm 맞나요?' : '')) : '';
    el.classList.toggle('warn', warn);
  });

  // 합계 · 장수
  var area = totalAreaMm2();
  byId('dimTotalArea').textContent = area > 0 ? (area / 1e6).toFixed(2) + '㎡' : '–';
  renderQtyLine('calc1000', calcQtyFromDim(true), ovrQty(true));
  renderQtyLine('calc500', calcQtyFromDim(false), ovrQty(false));

  // 견적
  var results = computeResults();
  lastResults = results;

  if (results.length === 0) {
    showEmptyState();
  } else {
    var hasAnyPhase2 = results.some(function(r){ return r.hasPhase2; });
    var hasAnyP1 = results.some(function(r){ return r.p1Discount > 0; });
    var costForCompare = function(r){ return hasAnyPhase2 ? r.finalCost : r.totalCost; };
    var minCost = Math.min.apply(null, results.map(costForCompare));
    results.forEach(function(r){ r.isCheapest = costForCompare(r) === minCost; });

    byId('chartSubLabel').textContent =
      hasAnyPhase2 ? '최종 체감가 기준' : (hasAnyP1 ? '예상 체감가 기준' : '총 견적 기준');
    byId('paymentNotice').style.display = 'block';

    var shown = visibleResults(results);
    renderQuoteContext(area);
    renderCompare(shown);
    renderProductCards(shown);
    if (shown.length > 1) renderChart(shown, hasAnyP1, hasAnyPhase2);
    else byId('chartCard').style.display = 'none';
  }

  renderReply(results);
  scheduleSave();
}

function showEmptyState() {
  var grid = byId('resultGrid');
  grid.className = 'result-grid single';
  grid.innerHTML =
    '<div class="empty-state">' +
      '<div class="empty-state-icon">📐</div>' +
      '<div class="empty-state-text">실측한 가로 × 세로를 넣으면<br>제품별 장수와 견적이 바로 나와요</div>' +
    '</div>';
  renderCompare([]);
  byId('quoteContext').style.display = 'none';
  byId('paymentNotice').style.display = 'none';
  byId('chartCard').style.display = 'none';
}

function renderQuoteContext(area) {
  var site = byId('siteInput').value.trim();
  var html = '<div class="quote-context-line">';
  if (site) html += '<span class="qc-val">' + escapeHtml(site) + '</span><span class="qc-divider">·</span>';
  if (area > 0) {
    html += '<span class="qc-label">실측</span>' +
            '<span class="qc-val">' + (area / 1e6).toFixed(2) + '㎡ <span class="small">(재단 여유 +10%)</span></span>';
  } else {
    html += '<span class="qc-label">장수</span><span class="qc-val">직접 입력</span>';
  }
  html += '</div>';
  byId('quoteContextBody').innerHTML = html;
  byId('quoteContext').style.display = 'block';
}

// 폰용 한 줄 비교 (제품이 2개 이상 보일 때만). 넓은 화면에서는 CSS로 숨기고 카드를 보여줌
function renderCompare(results) {
  var box = byId('compareList');
  if (results.length < 2) { box.className = 'cmp-list'; box.innerHTML = ''; return; }
  var html = '';
  results.forEach(function(r){
    var p = r.product;
    var displayCost = r.hasPhase2 ? r.finalCost : r.totalCost;
    var label = r.hasPhase2 ? '최종 체감가' : (r.p1Discount > 0 ? '예상 체감가' : '총 견적');
    html +=
      '<div class="cmp-row ' + p.cardClass + '" onclick="setProd(\'' + p.key + '\')">' +
        '<div class="cmp-top">' +
          '<span class="cmp-name">' + p.name + '</span>' +
          (p.badge ? '<span class="cmp-badge ' + p.badgeClass + '">' + p.badge + '</span>' : '') +
          '<span class="cmp-qty">' + r.totalQty + '<small>장</small></span>' +
        '</div>' +
        '<div class="cmp-bottom">' +
          (displayCost !== r.beforeDiscount ? '<span class="cmp-before">' + fmt(r.beforeDiscount) + '원</span>' : '') +
          '<span class="cmp-label">' + label + '</span>' +
          '<span class="cmp-final' + (r.hasPhase2 ? ' phase2' : '') + '">' + fmt(displayCost) + '원</span>' +
        '</div>' +
        (r.hasInstallFee ? '<div class="cmp-note">소량 시공비 +10만원 포함 (' + r.threshold + '장 이하)</div>' : '') +
      '</div>';
  });
  box.innerHTML = html;
  box.className = 'cmp-list on';
}

function renderProductCards(results) {
  var grid = byId('resultGrid');
  grid.className = 'result-grid' + (results.length === 1 ? ' single' : ' multi');
  grid.innerHTML = '';

  results.forEach(function(r){
    var p = r.product;
    var card = document.createElement('div');
    card.className = 'product-card ' + p.cardClass;

    var qtyNote = '';
    if (r.overridden) {
      qtyNote = '<div class="product-qty-label">' +
        (r.calcQty > 0 && r.calcQty !== r.totalQty ? '계산 ' + r.calcQty + '장 → 조정' : '직접 입력') + '</div>';
    }

    var installLine = r.hasInstallFee
      ? '<div class="product-install-note">⚠️ 소량 시공비 +10만원 (' + r.threshold + '장 이하)</div>'
      : '';

    var benefitRows = '';
    if (r.p1Discount > 0) {
      benefitRows += '<div class="product-row" style="color:#d32f2f;font-weight:600"><span>혜택 할인</span><span class="val" style="color:#d32f2f">-' + fmt(r.p1Discount) + '원</span></div>';
      r.p1Details.forEach(function(d){
        benefitRows += '<div class="product-row" style="font-size:10px;color:#999"><span style="padding-left:8px">· ' + d.name + '</span><span style="color:#999">-' + fmt(d.amount) + '원</span></div>';
      });
    }

    var phase2Section = '';
    if (r.hasPhase2) {
      phase2Section =
        '<div class="product-phase2-box">' +
          '<div class="product-phase2-title">⭐ 후기 이벤트 참여 시</div>' +
          '<div class="product-row" style="font-size:10px;color:#FF8F00"><span>추가 할인</span><span class="val" style="color:#FF8F00">-' + fmt(r.p2Discount) + '원</span></div>' +
          '<div class="product-phase2-final">' +
            '<div class="product-phase2-final-label">최종 체감가</div>' +
            '<div class="product-phase2-final-val">' + fmt(r.finalCost) + '원</div>' +
          '</div>' +
        '</div>';
    }

    var originalPriceLine = (r.p1Discount > 0)
      ? '<div class="product-total-original">' + fmt(r.beforeDiscount) + '원</div>'
      : '';

    card.innerHTML =
      (p.badge ? '<div class="product-badge ' + p.badgeClass + '">' + (p.icon ? p.icon + ' ' : '') + p.badge + '</div>' : '') +
      '<div class="product-name">' + p.name + '<div style="font-size:10px;font-weight:500;color:#888;margin-top:2px">' + p.label.slice(p.name.length) + '</div></div>' +
      '<div class="product-feature">' + p.feature + '</div>' +
      '<div class="product-divider"></div>' +
      '<div class="product-qty">' + r.totalQty + '<span style="font-size:14px;color:#999;font-weight:500"> 장</span></div>' +
      qtyNote +
      '<div class="product-row" style="margin-top:10px"><span>장당 단가</span><span class="val">' + fmt(p.price) + '원</span></div>' +
      '<div class="product-row"><span>매트 비용</span><span class="val">' + fmt(r.matCost) + '원</span></div>' +
      (r.hasInstallFee ? '<div class="product-row"><span style="color:#d32f2f">시공비 추가</span><span class="val" style="color:#d32f2f">+' + fmt(r.installFee) + '원</span></div>' : '') +
      benefitRows +
      '<div class="product-total">' +
        '<div class="product-total-label">' + (r.p1Discount > 0 ? '예상 체감가' : '총 견적') + '</div>' +
        originalPriceLine +
        '<div class="product-total-val">' + fmt(r.totalCost) + '원</div>' +
      '</div>' +
      installLine +
      phase2Section;

    grid.appendChild(card);
  });
}

function renderChart(results, hasAnyP1, hasAnyPhase2) {
  byId('chartCard').style.display = 'block';
  var hasAnyDiscount = hasAnyP1 || hasAnyPhase2;

  var allCosts = [];
  results.forEach(function(r){ allCosts.push(r.beforeDiscount, r.totalCost, r.finalCost); });
  var maxCost = Math.max.apply(null, allCosts);
  if (maxCost <= 0) maxCost = 1;

  var html = '';
  results.forEach(function(r){
    var p = r.product;
    var barClass = p.badgeClass === 'orange' ? 'bar-orange' :
                   p.badgeClass === 'amber' ? 'bar-amber' : '';
    var cheapestTag = r.isCheapest ? '<span class="chart-cheapest">최저가</span>' : '';

    var displayCost = hasAnyPhase2 ? r.finalCost : r.totalCost;
    var displayLabel = hasAnyPhase2 ? '최종 체감가' : (hasAnyP1 ? '예상 체감가' : '');
    var saved = r.beforeDiscount - displayCost;
    var savedBadge = (hasAnyDiscount && saved > 0)
      ? '<span class="chart-saved-badge">-' + fmt(saved) + '원 절약</span>'
      : '';

    var barsHtml = '';
    if (hasAnyDiscount) {
      var originalPct = (r.beforeDiscount / maxCost) * 100;
      var displayPct = (displayCost / maxCost) * 100;
      barsHtml =
        '<div class="chart-bar-track">' +
          '<div class="chart-bar bar-original" style="width:' + originalPct + '%">' +
            '<span class="chart-bar-tag">혜택 전</span>' +
            '<span class="chart-bar-val original">' + fmt(r.beforeDiscount) + '원</span>' +
          '</div>' +
        '</div>' +
        '<div class="chart-bar-track">' +
          '<div class="chart-bar ' + barClass + '" style="width:' + displayPct + '%">' +
            '<span class="chart-bar-tag">' + displayLabel + '</span>' +
            '<span class="chart-bar-val">' + fmt(displayCost) + '원</span>' +
          '</div>' +
        '</div>';
    } else {
      var pct = (displayCost / maxCost) * 100;
      barsHtml =
        '<div class="chart-bar-track" style="height:28px">' +
          '<div class="chart-bar ' + barClass + '" style="width:' + pct + '%">' +
            '<span class="chart-bar-val">' + fmt(displayCost) + '원</span>' +
          '</div>' +
        '</div>';
    }

    html +=
      '<div class="chart-row">' +
        '<div class="chart-label">' + p.name + cheapestTag + savedBadge + '</div>' +
        '<div class="chart-bar-wrap">' + barsHtml + '</div>' +
      '</div>';
  });

  byId('chartContent').innerHTML = html;
}

// ===== 현장 체크 =====
function renderChecklist() {
  var html = '';
  CHECK_GROUPS.forEach(function(g){
    html += '<div class="chk-group">' + g.title + '</div>';
    g.items.forEach(function(it){
      html +=
        '<div class="chk-item" id="chk_' + it.key + '">' +
          '<div class="chk-row">' +
            '<div class="chk-main" onclick="toggleSay(\'' + it.key + '\')">' +
              '<div class="chk-title">' + it.t + '</div>' +
              '<div class="chk-hint">' + it.c + '</div>' +
            '</div>' +
            '<div class="chk-btns">' +
              '<button type="button" class="chk-btn b-ok" onclick="setCheck(\'' + it.key + '\',1)">확인</button>' +
              '<button type="button" class="chk-btn b-flag" onclick="setCheck(\'' + it.key + '\',2)">특이</button>' +
            '</div>' +
          '</div>' +
          '<div class="chk-say">💬 ' + it.s + '</div>' +
          '<input class="chk-memo" type="text" autocomplete="off" placeholder="특이사항 (실측 결과에 들어가요)" oninput="setMemo(\'' + it.key + '\',this.value)">' +
        '</div>';
    });
  });
  byId('chkList').innerHTML = html;
}
function forEachCheckItem(fn) {
  CHECK_GROUPS.forEach(function(g){ g.items.forEach(fn); });
}
function applyCheckState() {
  var total = 0, ok = 0, flag = 0;
  forEachCheckItem(function(it){
    total++;
    var st = checkState[it.key] || { s: 0, memo: '' };
    var el = byId('chk_' + it.key);
    if (!el) return;
    el.classList.toggle('ok', st.s === 1);
    el.classList.toggle('flag', st.s === 2);
    var memo = el.querySelector('.chk-memo');
    if (memo && document.activeElement !== memo && memo.value !== (st.memo || '')) memo.value = st.memo || '';
    if (st.s === 1) ok++;
    if (st.s === 2) flag++;
  });
  byId('chkProgress').textContent = (ok + flag) + '/' + total;
  var fc = byId('chkFlagCount');
  fc.style.display = flag > 0 ? '' : 'none';
  fc.textContent = '특이 ' + flag;
}
// 같은 버튼을 한 번 더 누르면 해제
function setCheck(key, s) {
  var st = checkState[key] || (checkState[key] = { s: 0, memo: '' });
  st.s = (st.s === s) ? 0 : s;
  applyCheckState();
  if (st.s === 2) {
    var memo = document.querySelector('#chk_' + key + ' .chk-memo');
    if (memo) memo.focus();
  }
  renderReply(lastResults);
  scheduleSave();
}
function setMemo(key, val) {
  var st = checkState[key] || (checkState[key] = { s: 0, memo: '' });
  st.memo = val;
  renderReply(lastResults);
  scheduleSave();
}
function toggleSay(key) {
  var el = byId('chk_' + key);
  if (el) el.classList.toggle('open');
}
function applySayAll(on) {
  byId('chkList').classList.toggle('say-all', on);
  byId('chkSayToggle').classList.toggle('on', on);
}
function toggleSayAll() {
  var on = !byId('chkList').classList.contains('say-all');
  applySayAll(on);
  try { localStorage.setItem(SAY_KEY, on ? '1' : '0'); } catch (e) {}
}
function onNoteInput() {
  renderReply(lastResults);
  scheduleSave();
}
function collectCheck() {
  var flagged = [], okCount = 0, total = 0;
  forEachCheckItem(function(it){
    total++;
    var st = checkState[it.key];
    if (!st) return;
    if (st.s === 1) okCount++;
    if (st.s === 2) {
      var memo = (st.memo || '').trim();
      flagged.push(it.t + (memo ? ': ' + memo : ' (현장 안내)'));
    }
  });
  var note = byId('chkNote').value.trim().replace(/\s*\n+\s*/g, ' / ');
  return { flagged: flagged, okCount: okCount, total: total, note: note };
}

// ===== 실측 결과 문구 (고객 카톡 전달용) =====
function buildReply(results) {
  // 만원 단위 절사 표기 (cs-quote 카톡 답변과 같은 방식): 3060000 → "306만원"
  function toMan(n) { return Math.floor((n || 0) / 10000) + '만원'; }

  var BENEFIT_DISPLAY = {
    review_contract: '계약 후기(-3만)',
    group_buy: '공구(-3%)',
    onnuri: '온누리 결제(-7%)',
    review_event: '후기작성(-10만)'
  };
  var PRODUCT_REPLY_INFO = {
    mat1000_22: { feature: '층간소음, 아이안전' },
    mat1000_17: { feature: '아이안전, 난방효율⬆️' },
    mat500:     { feature: '층간소음, 아이안전, 합리적 가격' }
  };
  var REPLY_SIZE_SHORT = { mat1000_22:'(1M 2.2cm)', mat1000_17:'(1M 1.7cm)', mat500:'(50cm 2.2cm)' };
  var numberIcons = ['1️⃣', '2️⃣', '3️⃣'];

  var shown = visibleResults(results);
  var check = collectCheck();
  var hasCheck = check.flagged.length > 0 || check.okCount > 0 || !!check.note;
  if (shown.length === 0 && !hasCheck) return '';

  var text = '[돌봄매트 실측 견적]\n';
  var site = byId('siteInput').value.trim();
  if (site) text += site + '\n';
  var dimList = rooms
    .filter(function(r){ return roomArea(r) > 0; })
    .map(function(r){
      var name = (r.name || '').trim();
      return (r.minus ? ('제외' + (name ? ' ' + name : '')) : (name || '구역')) + ' ' + r.w + '×' + r.h;
    });
  if (dimList.length > 0) text += '· 실측 치수: ' + dimList.join(', ') + ' (mm)\n';
  text += '\n';

  var anyBenefit = BENEFITS.some(function(b){ return selectedBenefits[b.key]; });

  shown.forEach(function(r, i){
    var p = r.product;
    var info = PRODUCT_REPLY_INFO[p.key] || { feature: p.feature };
    var icon = shown.length > 1 ? (numberIcons[i] || '·') + ' ' : '';
    // 매트 금액과 소량 시공비를 나눠서 표기 (시공비는 "별도" 줄에 합계와 함께)
    var matFinal = Math.max(0, r.finalCost - r.installFee);
    var perFinal = Math.round(matFinal / r.totalQty);

    text += icon + p.name + ' ' + (REPLY_SIZE_SHORT[p.key] || p.label.slice(p.name.length)) + '\n';
    if (anyBenefit) {
      text += '장당 ' + fmt(p.price) + '원 → 체감가 ' + fmt(perFinal) + '원\n';
      text += r.totalQty + '장 ' + toMan(r.matCost) + ' → 체감가 ' + toMan(matFinal) + '\n';
    } else {
      text += '장당 ' + fmt(p.price) + '원\n';
      text += r.totalQty + '장 ' + toMan(r.matCost) + '\n';
    }
    if (r.hasInstallFee) {
      text += '※ 소량 시공비 +' + Math.floor(r.installFee / 10000) + '만원 별도 (' + r.threshold + '장 이하) → 합계 ' + toMan(r.finalCost) + '\n';
    }
    text += '· 특징: ' + info.feature + '\n\n';
  });

  var hasMat1000 = shown.some(function(r){ return r.product.is1000; });
  if (hasMat1000) {
    text += '※ 1000매트는 미끄럼방지 + 황변방지(UV) + 방오코팅이 적용되어 있어요. 미끄럼방지 강도는 제품마다 조금 다를 수 있어요 🙏\n\n';
  }

  if (shown.length > 0 && anyBenefit) {
    text += '🎁 체감가 적용된 혜택 안내\n';
    var KAKAO_BENEFIT_ORDER = ['review_contract', 'review_event', 'onnuri', 'group_buy'];
    var benefitItems = [];
    KAKAO_BENEFIT_ORDER.forEach(function(key){
      if (selectedBenefits[key] && BENEFIT_DISPLAY[key]) benefitItems.push('✔️' + BENEFIT_DISPLAY[key]);
    });
    for (var i = 0; i < benefitItems.length; i += 2) {
      text += benefitItems[i] + (i + 1 < benefitItems.length ? benefitItems[i + 1] : '') + '\n';
    }
    text += '\n';
  }

  if (hasCheck) {
    text += '📋 현장 확인\n';
    check.flagged.forEach(function(f){ text += '· ' + f + '\n'; });
    if (check.okCount > 0) {
      text += check.flagged.length > 0
        ? '· 그 외 ' + check.okCount + '개 항목 확인 완료\n'
        : '· ' + check.okCount + '개 항목 확인 완료 (특이사항 없음)\n';
    }
    if (check.note) text += '· 메모: ' + check.note + '\n';
    text += '\n';
  }

  text += '※ 실측 수량은 참고용이며, 최종 금액은 시공 당일 실제 시공된 매트 수량만큼만 정산됩니다.';
  return text;
}
function renderReply(results) {
  var text = buildReply(results || []);
  window._replyText = text;
  var el = byId('replyText');
  if (text) {
    el.removeAttribute('data-empty');
    el.textContent = text;
  } else {
    el.setAttribute('data-empty', 'true');
    el.textContent = '치수를 입력하면 실측 결과가 자동으로 만들어집니다.';
  }
}
function copyReply() {
  var text = window._replyText || '';
  if (!text) { showToast('⚠️ 치수를 먼저 입력하세요'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){
      showToast('✅ 복사 완료! 카톡에 붙여넣으세요');
    }).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('✅ 복사 완료!'); }
  catch (e) { showToast('⚠️ 복사 실패. 직접 선택해주세요'); }
  document.body.removeChild(ta);
}

// ===== 임시 저장 (화면이 새로고침돼도 입력이 남도록 이 기기에만 저장) =====
var saveTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 300);
}
function saveDraft() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      t: Date.now(),
      site: byId('siteInput').value,
      rooms: rooms.map(function(r){ return { name: r.name, minus: !!r.minus, w: r.w, h: r.h }; }),
      ovr1000: byId('ovr1000').value,
      ovr500: byId('ovr500').value,
      prod: selProd,
      ben: selectedBenefits,
      chk: checkState,
      note: byId('chkNote').value
    }));
  } catch (e) {}
}
// 저장된 입력을 되살림. 되살린 내용이 있으면 true
function loadDraft() {
  var d = null;
  try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { d = null; }
  if (!d || typeof d !== 'object' || !d.t || (Date.now() - d.t) > DRAFT_MAX_AGE) return false;
  if (!Array.isArray(d.rooms) || d.rooms.length === 0) return false;

  rooms = d.rooms.map(function(r){
    return { id: roomIdCounter++, name: String(r.name == null ? '' : r.name), minus: !!r.minus, w: onlyNum(r.w), h: onlyNum(r.h) };
  });
  renderRooms();
  byId('siteInput').value = typeof d.site === 'string' ? d.site : '';
  byId('ovr1000').value = onlyNum(d.ovr1000);
  byId('ovr500').value = onlyNum(d.ovr500);
  byId('chkNote').value = typeof d.note === 'string' ? d.note : '';

  if (d.prod === 'all' || PRODUCTS.some(function(p){ return p.key === d.prod; })) selProd = d.prod;
  if (d.ben && typeof d.ben === 'object') {
    selectedBenefits = {};
    BENEFITS.forEach(function(b){ if (d.ben[b.key]) selectedBenefits[b.key] = true; });
  }
  checkState = {};
  if (d.chk && typeof d.chk === 'object') {
    forEachCheckItem(function(it){
      var st = d.chk[it.key];
      if (st && (st.s === 1 || st.s === 2 || st.memo)) {
        checkState[it.key] = { s: (st.s === 1 || st.s === 2) ? st.s : 0, memo: String(st.memo == null ? '' : st.memo) };
      }
    });
  }

  var hasContent = rooms.some(function(r){ return r.w || r.h; }) ||
    !!byId('siteInput').value || !!byId('ovr1000').value || !!byId('ovr500').value ||
    !!byId('chkNote').value || Object.keys(checkState).length > 0;
  if (!hasContent) {
    // 입력한 내용이 없으면 새 현장으로 보고 제품·혜택 선택도 기본값으로
    selProd = 'all';
    selectedBenefits = { review_contract: true, group_buy: true, onnuri: true, review_event: true };
  }
  return hasContent;
}

function hideRestoreBar() {
  byId('restoreBar').style.display = 'none';
}

// ===== 전체 초기화 (다음 현장용) =====
function resetAll() {
  if (!confirm('입력한 치수와 체크 내용을 모두 지울까요?')) return;
  hideRestoreBar();
  byId('siteInput').value = '';
  byId('ovr1000').value = '';
  byId('ovr500').value = '';
  byId('chkNote').value = '';
  selProd = 'all';
  selectedBenefits = { review_contract: true, group_buy: true, onnuri: true, review_event: true };
  checkState = {};
  document.querySelectorAll('.chk-item.open').forEach(function(el){ el.classList.remove('open'); });
  document.querySelectorAll('.chk-memo').forEach(function(el){ el.value = ''; });
  initRooms();
  renderBenefits();
  updateProdSeg();
  applyCheckState();
  recalculate();
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  window.scrollTo(0, 0);
  showToast('✅ 초기화 완료');
}

// ===== 시작 =====
renderChecklist();
var sayAllSaved = false;
try { sayAllSaved = localStorage.getItem(SAY_KEY) === '1'; } catch (e) {}
applySayAll(sayAllSaved);

var restored = loadDraft();
if (!restored) initRooms();
renderBenefits();
updateProdSeg();
applyCheckState();
recalculate();
if (restored) {
  var restoredSite = byId('siteInput').value.trim();
  byId('restoreBarText').textContent = '이전 입력을 불러왔어요' + (restoredSite ? ' · ' + restoredSite : '');
  byId('restoreBar').style.display = 'flex';
}

byId('pageFooter').textContent = '돌봄매트 실측 견적 · v' + MEASURE_VER;
window.addEventListener('pagehide', saveDraft);
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') saveDraft();
});
</script>
