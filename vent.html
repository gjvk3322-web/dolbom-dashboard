<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매트 환기 방법 | 돌봄매트</title>
<meta name="description" content="돌봄매트를 쾌적하게 사용하는 방법 — 2주에 1번, 매트 1장을 분리해 환기해 주세요.">
<meta property="og:title" content="매트 환기 방법 | 돌봄매트">
<meta property="og:description" content="2주에 1번, 주무시기 전 매트 1장을 분리하고 다음 날 다시 끼워 주세요.">
<meta property="og:image" content="https://my.dolbommat.com/vent-poster.jpg">
<style>
  :root { --ink:#2b2925; --beige:#f0ece0; --green:#657d4f; --sub:#5f5b53; --line:#e4dfd2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: var(--ink); background: #faf8f3; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px calc(48px + env(safe-area-inset-bottom)); }
  .brand { font-size: 15px; font-weight: 700; color: var(--green); }
  h1 { font-size: 30px; font-weight: 800; margin: 6px 0 12px; letter-spacing: -.6px; line-height: 1.3; }
  .lead { font-size: 19px; font-weight: 600; line-height: 1.55; }
  .lead em { font-style: normal; color: var(--green); font-weight: 800; }
  .video { margin: 22px 0 26px; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
  .video video { width: 100%; height: 100%; display: block; }
  .step { display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; margin-bottom: 10px; }
  .step .n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 800; font-size: 17px; display: grid; place-items: center; margin-top: 1px; }
  .step p { font-size: 18px; font-weight: 700; line-height: 1.5; }
  .step p span { display: block; font-size: 16px; font-weight: 400; color: var(--sub); margin-top: 4px; }
  .cta { display: block; margin-top: 26px; text-align: center; background: var(--ink); color: #fff; text-decoration: none; font-weight: 700; padding: 17px; border-radius: 14px; font-size: 17px; }
  .foot { margin-top: 18px; text-align: center; font-size: 13px; color: #9a958a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">돌봄매트</div>
  <h1>매트 환기 방법</h1>
  <p class="lead">쾌적하게 사용하시려면<br><em>2주에 1번</em>, 매트 1장을 분리해<br>바닥을 환기해 주세요.</p>

  <div class="video">
    <video src="vent.mp4" poster="vent-poster.jpg" controls playsinline preload="metadata"></video>
  </div>

  <div class="step"><div class="n">1</div>
    <p>주무시기 전, 매트 1장을 분리해 주세요.<span>모서리부터 살살 들어 올리면 쉽게 빠져요.</span></p>
  </div>
  <div class="step"><div class="n">2</div>
    <p>다음 날, 제자리에 다시 끼워 주세요.<span>퍼즐 이음새가 잘 맞물려 들어가게만 끼우면 끝이에요.</span></p>
  </div>

  <a class="cta" href="https://pf.kakao.com/_UMyBK">궁금한 점은 카카오톡으로 문의하기</a>
  <p class="foot">돌봄매트 · www.dolbommat.com</p>
</div>
</body>
</html>
